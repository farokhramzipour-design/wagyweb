version: '3.8'

services:
  app:
    container_name: wagy-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
